name: 별바라기 사이트 반영
on:
  push:
    branches: [main]
  workflow_dispatch:
# 관리자 화면은 콘텐츠를 한 번에 커밋한 후 이 이벤트를 호출합니다.
# 해당 커밋의 [skip ci]는 push 중복 실행만 방지하며 workflow_dispatch는 실행됩니다.
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
